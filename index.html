<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kas Kelas</title>
<meta name="description" content="Aplikasi kas kelas: catatan pembayaran mingguan, saldo, dan laporan yang transparan.">
<meta name="theme-color" content="#16a06a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kas Kelas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Lensa kaca (pembiasan) untuk dock -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <filter id="lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='100' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='x'%3E%3Cstop offset='0' stop-color='%23f00'/%3E%3Cstop offset='.28' stop-color='%23800'/%3E%3Cstop offset='.72' stop-color='%23800'/%3E%3Cstop offset='1' stop-color='%23000'/%3E%3C/linearGradient%3E%3ClinearGradient id='y' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%230f0'/%3E%3Cstop offset='.3' stop-color='%23080'/%3E%3Cstop offset='.7' stop-color='%23080'/%3E%3Cstop offset='1' stop-color='%23000'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='%23808080'/%3E%3Crect width='100' height='100' fill='url(%23x)'/%3E%3Crect width='100' height='100' fill='url(%23y)' style='mix-blend-mode:screen'/%3E%3C/svg%3E" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="m"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="34" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<!-- Pembuka (animasi, tanpa teks) -->
<div id="intro" aria-hidden="true">
  <div class="in-rain r1"></div><div class="in-rain r2"></div>
  <i class="sh s1"></i><i class="sh s2"></i><i class="sh s3"></i><i class="sh s4"></i><i class="sh s5"></i><i class="sh s6"></i>
  <img class="fb f1" src="img/bill.webp" alt=""><img class="fb f2" src="img/bill.webp" alt=""><img class="fb f3" src="img/bill.webp" alt="">
  <img class="fb f4" src="img/bill.webp" alt=""><img class="fb f5" src="img/bill.webp" alt=""><img class="fb f6" src="img/bill.webp" alt="">
  <div class="in-card"><span class="dots3"><i></i><i></i><i></i></span><img class="in-pic" src="img/krabs.webp" alt=""><i class="coin k1"></i><i class="coin k2"></i><i class="coin k3"></i></div>
  <div class="in-bar"><i></i></div>
</div>

<div class="app">
  <aside class="side glass" id="side"></aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="dock" id="bottom" aria-label="Navigasi utama"></nav>

<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
